<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>בועות של סבתא</title>
<meta name="description" content="משחק בועות צבעוני עם 10,000 שלבים">
<meta name="theme-color" content="#7b3fd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="בועות של סבתא">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- HOME -->
  <section id="home" class="screen active">
    <div class="logo"><div class="logo-bubbles"><span></span><span></span><span></span></div><h1>בועות של סבתא</h1><p class="sub">10,000 שלבים של כיף צבעוני</p></div>
    <button class="btn big primary" id="btnPlay">▶ לשחק</button>
    <button class="btn big" id="btnMap">🗺️ בחירת שלב</button>
    <div class="row">
      <button class="btn" id="btnHelp">❓ עזרה</button>
      <button class="btn" id="btnSettings">⚙️ הגדרות</button>
    </div>
    <p class="progress" id="homeProgress"></p>
  </section>

  <!-- MAP -->
  <section id="map" class="screen">
    <header class="bar">
      <button class="btn icon" id="mapBack" aria-label="חזרה">🏠</button>
      <h2>בחירת שלב</h2>
      <span class="stars-total" id="starsTotal">⭐ 0</span>
    </header>
    <div id="levelGrid" class="level-grid"></div>
    <footer class="pager">
      <button class="btn" id="pgNext" aria-label="דף הבא">→ הבא</button>
      <span id="pgLabel"></span>
      <button class="btn" id="pgPrev" aria-label="דף קודם">הקודם ←</button>
    </footer>
    <div class="jump">
      <button class="btn small" id="pgCur">לשלב הנוכחי</button>
      <input id="jumpInput" type="number" inputmode="numeric" min="1" max="10000" placeholder="מספר שלב">
      <button class="btn small" id="jumpGo">עבור</button>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen">
    <header class="hud">
      <button class="btn icon" id="btnPause" aria-label="הפסקה">⏸</button>
      <div class="hud-box"><small>שלב</small><b id="hudLevel">1</b></div>
      <div class="hud-box"><small>נקודות</small><b id="hudScore">0</b></div>
      <div class="hud-box shots"><small>יריות</small><b id="hudShots">0</b></div>
      <div class="starbar" dir="ltr"><i id="starFill"></i><em style="left:33%" id="s1">☆</em><em style="left:66%" id="s2">☆</em><em style="left:96%" id="s3">☆</em></div>
    </header>
    <div id="stage"><canvas id="cv"></canvas></div>
    <footer class="boosters">
      <button class="btn booster" id="bstBomb" aria-label="פצצה">💣<span id="nBomb">1</span></button>
      <button class="btn booster" id="bstRainbow" aria-label="קשת">🌈<span id="nRainbow">1</span></button>
      <button class="btn booster" id="bstSwap" aria-label="החלפה">🔄 החלפה</button>
    </footer>
  </section>

  <!-- MODAL -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="card" id="modalCard"></div>
  </div>
  <div id="toast" class="toast hidden"></div>
</div>
<script src="game.js"></script>
</body>
</html>
